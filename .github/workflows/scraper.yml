name: Mercado Livre Price Monitor Cron

on:
  schedule:
    # Roda automaticamente a cada 5 minutos (limite padrão do GitHub Actions)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite rodar manualmente no GitHub

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install requests bs4 supabase python-dotenv cloudscraper

      - name: Executar verificação de preços
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python raspar_ofertas.py
