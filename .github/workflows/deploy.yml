name: CI / Deploy Pipeline

on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit supabase python-dotenv beautifulsoup4 requests

      - name: Validate Python files
        run: |
          python -m py_compile app.py scraper.py

      - name: Run scraper sanity check
        run: |
          python -c "from scraper import varrer_pagina_mercadolivre; print('scraper import OK')"
